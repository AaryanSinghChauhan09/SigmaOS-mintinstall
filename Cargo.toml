[package]
name = "sigmaos-mintinstall"
version = "0.1.0"
edition = "2021"
authors = ["SigmaOS Project"]
description = "Mint software installer"
license = "GPL-3.0-or-later"
repository = "https://github.com/AaryanSinghChauhan09/SigmaOS-mintinstall"
readme = "README.md"
keywords = ["mintinstall", "installer", "software"]
